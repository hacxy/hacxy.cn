<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hacxy</title>
    <!--app-head-->
    <script>
      // 防闪烁：首帧渲染前按 localStorage 偏好（无则跟随系统）设置 .dark
      ;(function () {
        try {
          var theme = localStorage.getItem('theme')
          var dark = theme
            ? theme === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {
          /* localStorage 不可用时静默跟随系统 */
        }
      })()
    </script>
    <script>
      // 主题过渡标记：支持 View Transitions API 时给 <html> 挂 .theme-vt，
      // CSS 以标记门控——标记存在时整页交叉淡化交给 View Transition（禁用 CSS 过渡），
      // 无标记（不支持该 API）时 CSS 过渡兜底。首帧前执行，避免切换瞬间样式闪跳。
      if (document.startViewTransition) {
        document.documentElement.classList.add('theme-vt')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
