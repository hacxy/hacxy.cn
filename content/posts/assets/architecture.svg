<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#0d1117"/>
  <text x="24" y="48" fill="#a371f7" font-family="monospace" font-size="20">content/posts/*.md</text>
  <text x="24" y="110" fill="#e6edf3" font-family="monospace" font-size="16">→ 内容管线（unified + remark/rehype）</text>
  <text x="24" y="158" fill="#e6edf3" font-family="monospace" font-size="16">→ Shiki 双主题高亮 + 锚点 + TOC</text>
  <text x="24" y="206" fill="#e6edf3" font-family="monospace" font-size="16">→ 内容清单 virtual:posts</text>
  <text x="24" y="254" fill="#e6edf3" font-family="monospace" font-size="16">→ renderToString 预渲染静态 HTML</text>
  <text x="24" y="302" fill="#e6edf3" font-family="monospace" font-size="16">→ dist/（任意静态服务器）</text>
  <text x="24" y="338" fill="#8b949e" font-family="monospace" font-size="14">构建期完成：正文 / 高亮 / 目录直接进 HTML，爬虫无需执行 JS</text>
</svg>
